name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    name: Tests unitaires
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v3


      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'


      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}


      - name: Run tests
        run: mvn test


  build:
    name: Build et Push Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}


      - name: Build jar
        run: mvn clean package -DskipTests


      - name: Login DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build and Push Docker image

        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:latest

  deploy:
        name: Déploiement Kubernetes
        runs-on: ubuntu-latest
        needs: build

        steps:
          - name: Checkout code
            uses: actions/checkout@v3

          - name: Installer kubectl
            uses: azure/setup-kubectl@v4
            with:
              version: latest

          - name: Configurer kubeconfig
            run: |
              mkdir -p ~/.kube
              echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
              chmod 600 ~/.kube/config

          - name: Déployer sur Kubernetes
            run: |
              kubectl rollout restart deployment ecommerce
              kubectl rollout status deployment ecommerce

