apiVersion: apps/v1
kind: Deployment

metadata:
  name: ecommerce

spec:

  replicas: 2

  selector:
    matchLabels:
      app: ecommerce

  template:

    metadata:
      labels:
        app: ecommerce

    spec:

      containers:
        - name: ecommerce

          image: 1sabrina10/ecommerce-api:v1.0.0

          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"


          envFrom:

            - configMapRef:
                name: ecommerce-config

            - secretRef:
                name: ecommerce-secret