apiVersion: apps/v1
kind: Deployment

metadata:
  name: ecommerce

spec:

  replicas: 2

  selector:
    matchLabels:
      app: ecommerce

  template:

    metadata:
      labels:
        app: ecommerce

    spec:

      containers:

        - name: ecommerce

          image: ecommerce:latest

          imagePullPolicy: Never

          ports:

            - containerPort: 8080

          envFrom:

            - configMapRef:
                name: ecommerce-config

            - secretRef:
                name: ecommerce-secret